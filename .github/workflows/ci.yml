# SPDX-License-Identifier: Apache-2.0
name: OpenCity Frontend CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or tag to deploy on server"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:catalog
      - run: npm run check:licenses
      - run: npm run build

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'HouHackathon-CHP' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy opencity-frontend over SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST || '118.70.222.137' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '2222' }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'chp' }}
          TARGET_REF: ${{ inputs.target_ref || github.ref_name || 'main' }}
        run: |
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY secret is empty or not granted access to this repository."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${SERVER_USER}@${SERVER_HOST}" \
            "~/opencity/redeploy.sh frontend ${TARGET_REF}"
